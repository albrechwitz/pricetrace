name: Deploy verified main to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  verify-and-package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node without package installation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify stage promotion and its successful PR checks
        run: node scripts/check-pages.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Test the exact deployment source
        run: node --test tests/*.test.mjs scripts/*.test.mjs
      - name: Inspect only the deployable static files
        run: node scripts/check-pages.mjs --site-only
      - name: Upload dist only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
          include-hidden-files: false

  deploy:
    needs: verify-and-package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
