name: Repository checks

on:
  pull_request:
    branches: [stage, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node without package installation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check route, commits, source and existing tests
        run: node scripts/check-repository.mjs
